# A Bugasura project's issue list - https://my.bugasura.io/issues/<projectId>
#
# Route is declared as the template `/issues/:id`, not any one concrete project's
# URL: the numeric segment is the project, not the screen, and keying the file name
# on a specific project's id would create a new "screen" for every project a test
# case happens to open. This screen is reached from bugasura__apps by clicking a
# project card (ProjectsPage.openProject(name)).
#
# Explored live via ai/autocode/browse.mjs against the "Faclon labs" project
# (id 110769) while writing TC_LOGIN_066, which searches the issue list and checks
# a result's status.

page:
  id: bugasura__issues-id
  name: Project issue list ("All Issues")
  purpose: List, search and filter a project's issues; each row shows its key, summary and status
  route: /issues/:id

navigation:
  entry_point: ProjectsPage.openProject(name) - clicks a project card on /apps and waits for the /issues/ URL
  authentication_required: true

elements:
  search_field:
    description: Issue-list search box, top of the list next to Filter/Sort
    role: textbox
    accessible_name: Search
    page_object: IssuesPage
    page_object_method: searchField
    locator_strategy: "#filter-value - only one copy on this screen, unlike the login/apps search fields there is no hidden duplicate to scope away"
  result_rows:
    description: The real issue rows currently listed
    page_object: IssuesPage
    page_object_method: resultRows
    locator_strategy: '#bugReport-table .tabulator-row[id^="tr_"] - excludes drafts, see states below'
  row_status_badge:
    description: The status text ("New", "Assigned", "Closed", ...) inside one row
    page_object: IssuesPage
    page_object_method: rowStatus
    locator_strategy: ".bug__bage:not(.mobile) scoped to the row - see states below for why :not(.mobile) is required"
  issue_checkbox_state:
    usage: assertion
    description: The state of the control in one issue row, addressed by its description.
    page_object: IssuesPage
    page_object_method: issueCheckboxState
    locator_strategy: "page.locator('.tabulator-row').filter({ hasText: description }).locator('.bugChecked')"
    parameter: description - the text identifying one row, supplied by the caller
  issue_checkbox:
    usage: action
    description: The control in one issue row, addressed by its description.
    page_object: IssuesPage
    page_object_method: issueCheckbox
    locator_strategy: "page.locator('.tabulator-row').filter({ hasText: description }).locator('.rounded-checkbox-ui')"
    parameter: description - the text identifying one row, supplied by the caller
  issue_row:
    usage: action
    description: The control in one issue row, addressed by its name.
    page_object: IssuesPage
    page_object_method: issueRow
    locator_strategy: "page.locator('#bugReport-table .bug-report__summary--text.hidden-xs').getByText(name)"
    parameter: name - the text identifying one row, supplied by the caller

actions:
  - name: search the issue list
    page_object: IssuesPage
    method: search
    description: Fills the search field and presses Enter; the table re-renders with matching issues plus any drafts

assertions:
  - name: search returned exactly one issue
    description: IssuesPage.resultRows() count - drafts are excluded by construction, so this counts only real matches
  - name: an issue's status
    description: IssuesPage.rowStatus(row) text - "New" observed for issue FAC-11 (Faclon labs project) on 2026-08-15

states:
  - name: drafts and real issues share one row class
    description: >
      #bugReport-table renders unsaved drafts (id="draft_header", id="draft_row_<n>")
      ABOVE real issues (id="tr_<projectInternalId>") under the same class
      ".tabulator-row". An unscoped ".tabulator-row" count includes drafts that were
      never submitted, which are not what a search's "resulted issue" means. Filter
      on the id prefix "tr_".
  - name: each row's status is rendered twice
    description: >
      One badge is ".bug__bage.mobile.visible-xs" for narrow layouts - its text node
      is EMPTY, the value lives only in its "data-bage-type" attribute - and a second,
      desktop ".bug__bage" carries the visible text a test reads. Both share the class
      "bug__bage", so an unscoped locator resolves to two elements per row; exclude
      ".mobile".
  - name: search matches by issue key/number, not by summary text
    description: >
      Searching "fac11" against the Faclon labs project returned the single issue
      whose prefix+number read "FAC" / "11" (i.e. FAC-11), not a text match against
      the summary. Verified live 2026-08-15.
  - name: the issues tab strip
    description: "Issues / Reports / Activity tabs sit above the list (#bugReport-table); this screen is the 'Issues' tab, heading reads 'All Issues'."

references:
  explored_project: "Faclon labs (project id 110769), team Faclon"

metadata:
  source: live exploration via ai/autocode/browse.mjs while writing TC_LOGIN_066
  last_verified: 2026-08-15
  knowledge_version: 1
