# Bugasura's Projects area at route /apps - the dashboard (tab strip, project list,
# search) AND the Create Project / Create New Team dialogs that open on top of it.
#
# Named after its route, because one screen resolves to exactly one file
# (ai/knowledge/canonical.ts). This is the merge of create-project.yaml and
# dashboard-tabs.yaml, which both declared `route: /apps`. They were not merely
# adjacent: both had independently explored and written down the same fact, that the
# h2 returned by WorkspacePage.sectionHeader() reads "All Projects" on arrival. That
# is what two files for one screen costs.
#
# The dialogs are a stack on top of this page, not a route of their own - the URL
# never changes when they open. So they belong here.
#
# Sources: tests-e2e/pages/projects.page.ts and workspace.page.ts (whose selectors
# were read off the live DOM), plus live explorations on 2026-08-12 for the gaps
# those did not answer. Semantics and Page Object methods only; no refs, no DOM dump.

page:
  id: bugasura__apps
  name: Projects dashboard, and the Create Project / Create New Team dialogs
  purpose: List and filter projects, create a project under a team, or create a new team from inside that flow
  route: /apps

navigation:
  entry_point: ProjectsPage.open() after sign-in; ProjectsPage.openCreateForm() opens the create dialog
  authentication_required: true

elements:
  dashboard_tab:
    description: One tab in the strip - My Favourites, All, Team Projects, Following - matched on its own label span, not the section heading, which repeats the same words
    page_object: WorkspacePage
    page_object_method: dashboardTab
    locator_strategy: ".dashboard-tab-options .project-tab-js filtered by .project-type-label text"
  section_header:
    description: The h2 above the project list - the element that actually moves when a tab is clicked
    page_object: WorkspacePage
    page_object_method: sectionHeader

  # The notification overlay. It is NOT part of this screen - the bell is signed-in
  # chrome and the recordings open the panel from /issues/<id> as well as from here,
  # with no URL change either time. It is declared here because knowledge has no
  # cross-route component concept yet and matching reads every file regardless of
  # route, so one declaration serves both screens.
  #
  # DO NOT COPY THESE INTO bugasura__issues-id.yaml. Two entries naming the same
  # method tie at the same rank, and findMethod refuses a tie - duplicating them
  # would silently stop the match working. Giving the component a home of its own
  # is the fix, and it belongs to a later phase.
  notifications_bell:
    description: Notification bell in the top bar - opens the notification panel; present on every signed-in screen
    role: link
    accessible_name: Notifications
    page_object: WorkspacePage
    page_object_method: notificationsBell
    locator_strategy: "#notif_bell_trigger, with getByRole link named Notifications as the fallback - the NON-exact form, since exact:true measured two"
  # Keyed by the element's own id, which is what findMethod's rank 2 compares a
  # recorded target against. An assertion records this panel as "#ap_notifications_panel"
  # and it has no accessible name to match on, so the key IS the identifier here.
  ap_notifications_panel:
    description: The notification overlay itself, listing activity and holding the preferences view
    page_object: NotificationsPanel
    page_object_method: panel
    locator_strategy: "#ap_notifications_panel - an authored id; its classes are state (fade, in, is-settings-open) and make no safe fallback"
  notification_settings_button:
    description: Control inside the notification panel that switches it to Notification Preferences
    role: button
    accessible_name: Notification settings
    page_object: NotificationsPanel
    page_object_method: settingsButton
    locator_strategy: "searched inside #ap_notifications_panel first, then page-wide by role and name"
  project_grid:
    description: >
      The grid of project cards on /apps - the list itself, not any one card. Declared
      so that ownership of anything recorded inside it is settled from the container
      rather than from the route: bugasura__apps.yaml describes three owners for /apps
      (WorkspacePage, NotificationsPanel, ProjectsPage), so the route alone cannot say
      which one a project card belongs to. It belongs to ProjectsPage, which already
      owns project search, project creation and the project dialogs; WorkspacePage owns
      the surrounding chrome (tab strip, notifications bell, section heading).
      It deliberately declares no method. The entry exists to settle OWNERSHIP of a
      container, not to offer a capability - nothing calls it, and it cannot become a
      reuse candidate because every resolver requires a method that exists on the class.
    page_object: ProjectsPage
    locator_strategy: "#all_apps - the authored id of the project grid container"
  project_search_field:
    description: Search box in the dashboard header, beside the Filter button
    role: textbox
    accessible_name: Search
    page_object: ProjectsPage
    page_object_method: projectSearchField
    locator_strategy: "getByRole textbox named Search; a CSS fallback on .js-input-search MUST filter :visible - see the duplicate-input state below"
  create_project_button:
    description: "+ Create Project" trigger on the dashboard
    role: button
    page_object: ProjectsPage
    page_object_method: createProjectButton
  create_project_heading:
    description: Heading proving the "Create New Project" dialog actually opened
    page_object: ProjectsPage
    page_object_method: createProjectDialogHeading
  project_name_field:
    description: Project name input in the Create New Project dialog
    role: textbox
    accessible_name: Enter a Project Name
    page_object: ProjectsPage
    page_object_method: projectNameField
    locator_strategy: "#proj_name, with getByPlaceholder(/project name/i) as the fallback - the placeholder IS the accessible name, which is the name a recording carries for it"

  team_dropdown_button:
    description: Opens the team list, which also contains "Create New Team" as its last item
    page_object: ProjectsPage
    page_object_method: teamDropdownButton
  create_new_team_option:
    description: Link inside the team dropdown that opens the separate "Create New Team" dialog
    role: link
    accessible_name: Create New Team
    page_object: ProjectsPage
    page_object_method: createNewTeamOption
  create_new_team_heading:
    description: Heading of the "Create New Team" dialog - a SEPARATE dialog from Create Project, not a step inside it
    page_object: ProjectsPage
    page_object_method: createNewTeamHeading
  create_team_invite_dialog:
    description: >
      The "Create New Team" dialog container itself. Declared for the same reason
      project_grid is, and in the same shape: ownership of anything recorded INSIDE it
      is settled from the container rather than from the route, because this file
      describes three owners for /apps (WorkspacePage, NotificationsPanel, ProjectsPage)
      and the route alone cannot say which one owns a control in this dialog. That
      refusal is what sent TC_LOGIN_127's Cancel button - an element ProjectsPage
      already had a method for - to a model to have its owner guessed.
      ProjectsPage is not a choice made here. Every element of this dialog above is
      already assigned to it: the heading, the team name field, the tagsinput proxy,
      Add, the email error and Cancel. This states what the file already says.
      It deliberately declares no method, exactly as project_grid does. The entry
      settles OWNERSHIP of a container; it is not a capability, nothing calls it, and it
      cannot become a reuse candidate because every resolver requires a method that
      exists on the class. The key is descriptive rather than the DOM id, so it cannot
      collide with an entry the writer might render for the dialog element itself.
    page_object: ProjectsPage
    locator_strategy: "#create_team_invite_modal - the authored id of the Create New Team dialog container"
  team_name_field:
    description: "Team Name *" input in the Create New Team dialog
    accessible_name: Enter team name
    page_object: ProjectsPage
    page_object_method: teamNameField
  team_email_input_area:
    description: Visible tagsinput proxy container for inviting people by email; click the container, not the hidden real input
    page_object: ProjectsPage
    page_object_method: teamEmailInputArea
  add_team_member_button:
    role: button
    accessible_name: Add
    page_object: ProjectsPage
    page_object_method: addTeamMemberButton
  team_email_error:
    description: Inline validation message beside the team-invite email field
    page_object: ProjectsPage
    page_object_method: teamEmailError
  create_team_cancel_button:
    description: Cancel button of the Create New Team dialog - closes ONLY that dialog, the Create Project dialog underneath stays open
    page_object: ProjectsPage
    page_object_method: createTeamCancelButton
    # DECLARED SO THE RESOLVER CAN FIND WHAT ALREADY EXISTS. The method has existed on
    # ProjectsPage since this entry was written, and no resolver could reach it: the
    # recorded target is "Cancel", which matches neither the key nor the method words,
    # and findMethodByProvenLocator needs a concrete selector to compare the proven
    # expression against. With none declared, TC_LOGIN_127 measured
    # `page.locator("#create_team_cancel_btn")` at one element with identity proven,
    # found no capability, and went on to ask a model who owned an element the
    # repository already owned. This is that selector, and it is exactly what
    # projects.page.ts resolves.
    locator_strategy: "page.locator('#create_team_cancel_btn')"
  project_cancel_button:
    description: Cancel button of the Create New Project dialog
    page_object: ProjectsPage
    page_object_method: cancelButton
  intro_help:
    usage: action
    description: Tour - operated on the WorkspacePage screen.
    page_object: WorkspacePage
    page_object_method: introHelp
    locator_strategy: "page.locator('#intro_help')"
  project_card:
    usage: action
    description: The control in one project row, addressed by its description.
    page_object: ProjectsPage
    page_object_method: projectCard
    locator_strategy: "page.locator('#all_apps .title').filter({ hasText: description })"
    parameter: description - the text identifying one row, supplied by the caller
  new_issue:
    usage: action
    description: add Add Issue - operated on the WorkspacePage screen.
    page_object: WorkspacePage
    page_object_method: newIssue
    locator_strategy: "page.locator('#bug_no_issue_added .mdl-button').filter({ hasText: 'add Add Issue' })"
  reports_nav_link:
    usage: action
    description: The control in one workspace row, addressed by its description.
    page_object: WorkspacePage
    page_object_method: reportsNavLink
    locator_strategy: "page.locator('#reports_nav .js-activity-link').filter({ hasText: description })"
    parameter: description - the text identifying one row, supplied by the caller
  bug_report_overview_link:
    usage: action
    description: The control in one workspace row, addressed by its description.
    page_object: WorkspacePage
    page_object_method: bugReportOverviewLink
    locator_strategy: "page.locator('#bugreport_main_container .js-overview-link').filter({ hasText: description })"
    parameter: description - the text identifying one row, supplied by the caller
  desktop_web_platform_option:
    usage: action
    description: Desktop Web - operated on the ProjectsPage screen.
    page_object: ProjectsPage
    page_object_method: desktopWebPlatformOption
    locator_strategy: "page.locator('#first-project-create-form .panel').filter({ hasText: 'Desktop Web' })"
  project_button:
    usage: action
    description: The control in one project row, addressed by its description.
    page_object: ProjectsPage
    page_object_method: projectButton
    locator_strategy: "page.locator('#team_select_create .team-list-item').filter({ hasText: description })"
    parameter: description - the text identifying one row, supplied by the caller
  new_issues_badge:
    usage: action
    description: The control in one workspace row, addressed by its description.
    page_object: WorkspacePage
    page_object_method: newIssuesBadge
    locator_strategy: "page.locator('#issue_stats_section .u-dis-f-rc').filter({ hasText: description })"
    parameter: description - the text identifying one row, supplied by the caller

actions:
  - name: select a dashboard tab
    description: Click the locator returned by dashboardTab(name)
    page_object: WorkspacePage
    method: dashboardTab
  - name: open the create-project form
    page_object: ProjectsPage
    method: openCreateForm
  - name: open the create-new-team popup from the team dropdown
    page_object: ProjectsPage
    method: openCreateNewTeamForm
  - name: type an email into the team-invite field
    page_object: ProjectsPage
    method: enterTeamEmail
    description: Clicks the tagsinput container then types via the keyboard - fill() alone does not arm the Add button
  - name: submit the typed email
    page_object: ProjectsPage
    method: submitTeamEmail
  - name: dismiss the onboarding modal
    page_object: ProjectsPage
    method: dismissOnboardingModal
    description: Setup, not part of any test case's intent - ProjectsPage.open() already calls it

assertions:
  - name: a tab is the selected one
    description: >
      WorkspacePage.isTabActive(name) - verified live 2026-08-12: the clicked tab's
      element gains classes "active pointer-events-none" (the default on load is
      "All" carrying that same class), every other tab has just "project-tab-js".
  - name: the heading names the selected set
    description: >
      sectionHeader() text equals the tab's own label exactly - "All Projects" on
      arrival (default "All" tab), then plain "Team Projects" (not "Team Projects
      Projects") once that tab is clicked. Verified live 2026-08-12.
  - name: the Create New Project dialog opened
    description: createProjectDialogHeading() visible
  - name: the Create New Team dialog opened
    description: createNewTeamHeading() visible - a distinct dialog, stacked over Create Project
  - name: an invalid team-invite email was rejected
    description: 'teamEmailError() text is exactly "Please enter valid email ID" (verified live, 2026-08-12) - no request is sent, nothing is added'
  - name: cancelling both popups returns to the dashboard
    description: >
      URL stays /apps throughout (this is a same-page dialog stack, not a route
      change). After both Cancels: createProjectDialogHeading() is hidden,
      createProjectButton() is visible again, and sectionHeader() reads "All
      Projects" - that heading, not a URL change, is what "back on the dashboard"
      actually means here.

states:
  - name: tab labels are always in the DOM
    description: >
      All four tab labels are present at all times, so "is My Favourites on the
      page?" is true before anything is clicked. The element that moves is the h2
      heading, plus the active class on the tab. Assert the heading; the label
      witnesses nothing.
  - name: tab counts are live badges, not part of the label
    description: 'Each tab renders as "<label> (<count>)" e.g. "Team Projects (3)" - the count is a sibling node, so matching the label text alone (dashboardTab does) is what keeps the locator stable as counts change.'
  - name: selecting a tab is a same-page state change
    description: URL stays /apps; no navigation, no reload. Only the active class and the h2 text change.
  - name: two search inputs share one class
    description: >
      Bugasura mounts a second, hidden copy of the project search input for the
      mobile layout under the same class .js-input-search. getByRole resolves to the
      visible one because the hidden copy has no accessible role, but any CSS
      selector must filter :visible or it can resolve to the wrong input.
  - name: Create Project and Create New Team are two separate dialogs, not one wizard
    description: >
      Opening "Create New Team" from the team dropdown stacks a SECOND dialog
      (#create_team_invite_modal) on top of the first (#first-project-create-form's
      dialog). Cancelling the team dialog leaves the project dialog exactly as it
      was; cancelling that separately is what returns to the dashboard.
  - name: "Create New Team can fail to open on click - a live application defect"
    description: >
      Observed live (2026-08-12): clicking the "Create New Team" link occasionally
      throws `$(...).tagsinput is not a function` in the page's own console and
      leaves #create_team_invite_modal at display:none - the click registers but the
      dialog never appears. A retry of the same click succeeds. This is a Bugasura
      bug, not a selector problem - do not add a retry-the-click workaround to the
      Page Object to paper over it; a test that hits this should fail honestly (the
      web-first `toBeVisible()` wait does not retry the click itself, only the
      assertion).
  - name: tagsinput proxy input
    description: >
      #create_team_invite_modal .bootstrap-tagsinput is a visible container painted
      over the real, hidden #team_invite_user_email input. Click the container
      (focuses the plugin's proxy), then use the keyboard to type - `fill()` sets the
      value without the keystrokes the plugin listens for, so the Add button never
      arms.

# Blocking UI that a previous generation case can leave behind on this screen, and
# how to close it safely. Read by ai/autocode/session.ts before a reused browser is
# handed to the next case: it checks each `selector` for visibility and, if one is
# showing, clicks its `close_selector`. Nothing here is guessed and nothing else is
# ever clicked - a reset that clicks around hopefully is worse than a fresh browser.
overlays:
  - name: onboarding report modal
    description: Can sit over the project list and swallow clicks; ProjectsPage.dismissOnboardingModal() closes the same thing during a test
    selector: "#first_report_modal"
    close_selector: "#first_report_modal button:has-text('close')"
  - name: Create New Team dialog
    description: Left open if a case stopped mid-flow; closes on its own Cancel, leaving the Create Project dialog behind it
    selector: "#create_team_invite_modal"
    close_selector: "#create_team_invite_modal button:has-text('Cancel')"

references:
  accessibility_snapshot: .playwright-mcp/page-2026-08-12T07-49-09-936Z.yml

metadata:
  source: tests-e2e/pages/projects.page.ts, tests-e2e/pages/workspace.page.ts, live exploration via ai/autocode/browse.mjs
  last_verified: 2026-08-12
  knowledge_version: 2
  merged_from: create-project.yaml and dashboard-tabs.yaml, both route /apps
