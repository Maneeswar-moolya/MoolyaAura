# Bugasura's sign-in screen at route / - the sign-in form AND the language picker
# that sits on it.
#
# This file is named after its route, not after what a test case calls it, because
# one screen must resolve to exactly one file (ai/knowledge/canonical.ts). It is the
# merge of what used to be login.yaml and language-picker.yaml, which both declared
# `route: /` and were therefore two files for one screen - the duplication the
# canonical identity exists to prevent.
#
# The old language-picker.yaml argued for staying separate because five test cases
# are about the picker specifically. That is a good reason to keep its detail, which
# is all here, and not a reason for a second file: a row about the picker and a row
# about the sign-in button are looking at the same screen, and whoever explores one
# should see what the other learned.
#
# Distilled from tests-e2e/pages/login.page.ts, the Bugasura facts in CLAUDE.md, the
# language table in tests-e2e/generated/login-test-cases.spec.ts, and the stored
# snapshots under .playwright-mcp/. Semantics and Page Object methods only; no refs,
# no DOM dump.

page:
  id: bugasura__root
  name: Bugasura sign-in page and language picker
  purpose: Sign in with email and password, choose the interface language, or reach sign-up, reset and terms
  route: /

navigation:
  entry_point: LoginPage.open() navigates to https://my.bugasura.io/
  authentication_required: false
  prerequisites:
    - BUGASURA_EMAIL and BUGASURA_PASSWORD in .env for any signed-in assertion

elements:
  email_field:
    description: Email input of the sign-in form
    role: textbox
    accessible_name: Email
    label: Email
    page_object: LoginPage
    page_object_method: emailField
  password_field:
    description: Password input of the sign-in form
    role: textbox
    label: Password
    page_object: LoginPage
    page_object_method: passwordField
  sign_in_button:
    description: Submit control while the UI is in English
    role: button
    accessible_name: Sign In
    page_object: LoginPage
    page_object_method: signInButton
  localised_sign_in_button:
    description: The same submit control, found without depending on its wording, so it survives a language change
    page_object: LoginPage
    page_object_method: localisedSignInButton
    locator_strategy: "class .login-submit - use this whenever the language changes"
  forgot_password_link:
    description: Reset-password link under the form
    role: link
    accessible_name: Forgot Password?
    page_object: LoginPage
    page_object_method: forgotPasswordLink
  terms_link:
    description: Terms of service link; opens a new tab on a different host
    role: link
    page_object: LoginPage
    page_object_method: termsLink
  error_toast:
    description: Sign-in error message
    role: alert
    page_object: LoginPage
    page_object_method: errorMessage
    locator_strategy: "#toast-container .toast-message - auto-dismisses, so poll"
  language_toggle:
    description: Globe button that opens the picker; its own label is the CURRENT language
    role: button
    page_object: LoginPage
    page_object_method: languageToggle
    locator_strategy: "class .js-lang-toggle scoped to #login_area - NOT by accessible name, which is the very thing a test changes"
  selected_language_label:
    description: The language name printed on the toggle
    page_object: LoginPage
    page_object_method: selectedLanguageLabel
    locator_strategy: "class .js-lang-label"
  language_menu_heading:
    description: The picker's own heading, localised - "Select Language" in English
    page_object: LoginPage
    page_object_method: languageMenuHeading
    locator_strategy: "class .js-lang-menu .ba-dropdown__header"
  language_option:
    description: One language row, by the name the application stores on it
    role: link
    page_object: LoginPage
    page_object_method: languageOption
    locator_strategy: "attribute data-lang-name, which survives the list being translated"
  all_language_options:
    description: Every language the picker offers, in its own order
    page_object: LoginPage
    page_object_method: languageOptions
  active_language_option:
    description: The row the application marks as chosen
    page_object: LoginPage
    page_object_method: activeLanguageOption
    locator_strategy: "class .active"
  # THE ONLY CAPABILITY FOR #password_field-error, and it must stay that way.
  #
  # It was declared here with no implementation on LoginPage, and a declaration with no
  # method is invisible to `existingCapability` - which requires the method to be on the
  # class, correctly, because a method that does not exist cannot be reused. So the
  # element read as undescribed and the abstraction engine wrote a SECOND capability for
  # it (`passwordFieldErrorState`, from TC_LOGIN_120), whose description carried the
  # recorder's `[type=password]` redaction marker. Both are gone; this one is implemented.
  password_length_error:
    description: Inline message when the password is under 5 characters; only rendered on submit, not while typing
    label: "Not too short! enter min 5 characters."
    page_object: LoginPage
    page_object_method: passwordLengthError
    locator_strategy: "#password_field-error - a <label for=password_field>, structural because it has no distinguishing ARIA role"

actions:
  - name: open the sign-in page
    page_object: LoginPage
    method: open
  - name: sign in with credentials
    page_object: LoginPage
    method: signIn
  - name: open the terms of service
    description: Clicks the link and returns the new tab it opened
    page_object: LoginPage
    method: openTerms
  - name: open the language picker
    page_object: LoginPage
    method: languageToggle
    description: Click the locator this returns
  - name: choose a language
    page_object: LoginPage
    method: languageOption
    description: Pass the English language name, then click the locator; the page reloads

assertions:
  - name: still on the sign-in page
    description: LoginPage.isOnLoginPage() - true while the sign-in form is visible
  - name: sign-in failed with a message
    description: LoginPage.errorText() reads the toast; it disappears after ~5s
  - name: signed in
    description: WorkspacePage.isSignedIn() after the app redirects itself to /apps
  - name: a field rejected its input
    description: LoginPage.hasValidationSignal() for client-side validation
  - name: the password is too short
    description: "LoginPage.passwordLengthError() - confirmed copy, unlike the rest of this form's validation: \"Not too short! enter min 5 characters.\""
  - name: the language picker is open
    description: languageMenuHeading() must be asserted VISIBLE, never merely present
  - name: the selected language changed
    description: selectedLanguageLabel() shows the new language, and activeLanguageOption() marks its row
  - name: the interface is translated
    description: localisedSignInButton() carries the new language's own wording - German Anmelden, Indonesian Masuk, Japanese sign-in text
  - name: how many languages are offered
    description: languageOptions() count, excluding the search box empty state

states:
  - name: forms all mounted at once
    description: "#loginForm, #createUserForm and #resetForm are ALL in the DOM from page load, so scope every locator to #login_area or #loginForm and filter :visible - an unscoped count never reaches zero"
  - name: redirect after success
    description: The app navigates itself to /apps; wait for that rather than calling goto(), which aborts it
  - name: invalid submit
    description: Client-side validation blocks the request entirely, so no network call is made
  - name: password length error only on submit
    description: "Typing a short password alone renders nothing; #password_field-error only appears after a submit attempt, and only while the password stays under 5 characters"
  - name: language menu present but hidden
    description: The heading and every option are in the DOM from page load and only hidden, so a presence check is true before anything is clicked and witnesses nothing
  - name: duplicate picker in the sign-up panel
    description: "The hidden sign-up panel carries its own copy under the same ids and classes, so unscoped .js-lang-item matches 28 elements - always scope to #login_area"
  - name: applying a language reloads
    description: The widget updates in place and the page reloads to /?go=login a moment later, so a click issued in that window is discarded - re-assert or retry idempotently
  - name: no two languages share wording
    description: Each language has a unique sign-in label and heading, which is what lets an assertion after a reload prove the reload happened

# The languages the picker offers, with the wording Bugasura actually renders. Read
# off the live application on 2026-08-11/12 and already relied on by TC_LOGIN_025 -
# recorded here so no future row has to visit fourteen languages to find it out.
# `option` is the value for data-lang-name; `sign_in` and `heading` are what the page
# shows once it is chosen. Never translate these - if the app ships different copy
# that is a defect to report, not a string to loosen.
languages:
  - option: German
    sign_in: Anmelden
    heading: Sprache auswählen
  - option: Indonesian
    sign_in: Masuk
    heading: Pilih Bahasa
  - option: Japanese
    sign_in: サインイン
    heading: 言語を選択
  - option: Portuguese
    reference: "see the LANGUAGES table in tests-e2e/generated/login-test-cases.spec.ts for the exact copy"
  - option: Italian
    sign_in: Accedi
    heading: Seleziona la lingua
  - option: Russian
    sign_in: Войти
    heading: Выберите язык
  - option: English
    sign_in: Sign In
    heading: Select Language
  - option: others
    reference: "the full verified set of 14 is the LANGUAGES table in tests-e2e/generated/login-test-cases.spec.ts - read that file rather than the browser"

references:
  accessibility_snapshot: .playwright-mcp/page-2026-08-12T07-49-09-936Z.yml

metadata:
  source: tests-e2e/pages/login.page.ts, CLAUDE.md Bugasura facts, tests-e2e/generated/login-test-cases.spec.ts language table, .playwright-mcp snapshots
  last_verified: 2026-08-15
  knowledge_version: 4
  merged_from: login.yaml and language-picker.yaml, both route /
