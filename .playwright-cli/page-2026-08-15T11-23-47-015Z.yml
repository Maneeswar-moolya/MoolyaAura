                    - generic [ref=f14e250]: Detailed Description:-The line chart is not displaying data correctly for weekly and monthly periodicities. Specifically, the chart is rendered as a flat line instead of reflecting the expected trends and fluctuations in data points over time. This issue may stem from incorrect data aggregation or mapping algorithms that handle periodic data visualization.Impact:-This issue severely impacts users’ ability to analyze trends and make informed decisions based on data visualizations. Businesses rely on accurate data representation for reporting and strategic planning, and a flat line suggests that there is no variance or insights to be gained, potentially leading to misinformed decisions. There is also a risk of reduced user confidence in the analytical tools provided by the application.Expected Behaviour:-When users select weekly or monthly periodicities for the line chart, the chart should accurately represent the trends and data points over the selected time frame. The chart must display fluctuations and variations in the data to provide clear insights, fulfilling user expectations for data visualization. The system should also ensure that the underlying data is aggregated and displayed correctly based on the chosen periodicity. Correct Value for Monthly= “994843.5”Correct Value for Weekly= “[ 136981.03, 218627.27, 212870.88, 223984.47, 202379.85 ]”
