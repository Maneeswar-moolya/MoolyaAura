                    - generic [ref=f14e496]: Detailed Description:-The line chart in compare mode is designed to display a full 24-hour period (from 12 AM to 12 AM) for a selected day in the calendar. However, upon selecting a specific day, the line graph currently generates data for an incorrect duration, causing significant discrepancies in visualized data representation. This issue negatively affects data analysis, reporting, and user decision-making as the visualized period does not align with expected durations.Impact:-This issue could severely impact users' ability to accurately analyze data trends, as the displayed line graph does not represent a complete daily cycle. This may lead to misleading interpretations and decisions based on incomplete information. For the business, the integrity of reports and analytics could be compromised, resulting in reduced trust in the tool and potential reputational risks.Expected Behaviour:-When a user selects a day from the calendar in compare mode, the line graph should consistently display data covering the entire 24-hour period from 12 AM to 12 AM of that selected day, thereby providing an accurate representation of that day’s data. All systems handling date and time should be configured to correctly process and display these durations.
