# Generic workbook validation, independent of the upstream MCP suite.
# Live application CI bindings are configured when an application is onboarded.
name: Excel workbook contracts
on:
  push:
    branches: [ main ]
    paths: [ 'excel/**', 'tests-e2e/**', 'ai/**', 'playwright.excel.config.ts', '.github/workflows/excel-suite.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'excel/**', 'tests-e2e/**', 'ai/**', 'playwright.excel.config.ts', '.github/workflows/excel-suite.yml' ]
  workflow_dispatch:
jobs:
  workbook:
    name: Validate registered workbooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: '20'
        cache: 'npm'
    - run: npm ci
    - name: Validate each workbook in its declared application scope
      run: |
        node --import tsx <<'NODE'
        const { readRegistry } = require('./ai/projects/registry.ts');
        const { spawnSync } = require('node:child_process');
        const registry = readRegistry();
        if (!registry.applications.length) console.log('No applications registered; nothing to validate.');
        for (const app of registry.applications) {
          for (const workbook of app.workbooks) {
            for (const [command, flags] of [['sync-data', ['--strict']], ['quality', []]]) {
              const result = spawnSync(process.execPath, ['node_modules/tsx/dist/cli.mjs',
                'ai/excel/cli.ts', command, workbook, ...flags], {
                stdio: 'inherit', env: { ...process.env, AURA_APPLICATION: app.applicationId },
              });
              if (result.error || result.status !== 0) process.exit(result.status || 1);
            }
          }
        }
        NODE
    - name: Upload quality reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: quality-reports
        path: ai/reports/
        if-no-files-found: ignore
